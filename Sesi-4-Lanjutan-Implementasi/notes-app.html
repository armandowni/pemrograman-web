<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-primary {
            background-color: #4CAF50;
            color: white;
        }

        .btn-primary:hover {
            background-color: #45a049;
        }

        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .note-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }

        .note-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .note-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            word-break: break-word;
        }

        .note-category {
            display: inline-block;
            background-color: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 10px;
            width: fit-content;
        }

        .note-content {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 15px;
            flex-grow: 1;
            word-break: break-word;
            max-height: 100px;
            overflow-y: auto;
        }

        .note-date {
            font-size: 12px;
            color: #999;
            margin-bottom: 10px;
        }

        .note-actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-edit {
            background-color: #2196F3;
            color: white;
        }

        .btn-edit:hover {
            background-color: #0b7dda;
        }

        .btn-delete {
            background-color: #f44336;
            color: white;
        }

        .btn-delete:hover {
            background-color: #da190b;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .empty-state {
            text-align: center;
            color: white;
            padding: 60px 20px;
            font-size: 18px;
        }

        .close-modal {
            background-color: #999;
            color: white;
        }

        .close-modal:hover {
            background-color: #777;
        }

        .btn-save {
            background-color: #4CAF50;
            color: white;
        }

        .btn-save:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Notes App</h1>

        <div class="controls">
            <input 
                type="text" 
                class="search-box" 
                id="searchBox" 
                placeholder="Cari notes..."
                onkeyup="filterNotes()"
            >
            <button class="btn btn-primary" onclick="openAddModal()">+ Tambah Note</button>
        </div>

        <div class="notes-grid" id="notesGrid"></div>

        <div class="empty-state" id="emptyState">
            Belum ada notes. Mulai tambahkan!
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="noteModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">Tambah Note</div>
            <form onsubmit="saveNote(event)">
                <div class="form-group">
                    <label for="noteTitle">Judul:</label>
                    <input type="text" id="noteTitle" required>
                </div>

                <div class="form-group">
                    <label for="noteCategory">Kategori:</label>
                    <select id="noteCategory">
                        <option value="Personal">Personal</option>
                        <option value="Work">Work</option>
                        <option value="Ideas">Ideas</option>
                        <option value="Todo">Todo</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="noteContent">Konten:</label>
                    <textarea id="noteContent" required></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-small close-modal" onclick="closeModal()">Batal</button>
                    <button type="submit" class="btn btn-small btn-save">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let notes = [];
        let editingId = null;

        // Load notes from localStorage
        function loadNotes() {
            let stored = localStorage.getItem("notes");
            if (stored) {
                notes = JSON.parse(stored);
            }
            render();
        }

        // Save notes to localStorage
        function saveNotesToStorage() {
            localStorage.setItem("notes", JSON.stringify(notes));
        }

        // Open add modal
        function openAddModal() {
            editingId = null;
            document.getElementById("modalTitle").textContent = "Tambah Note";
            document.getElementById("noteTitle").value = "";
            document.getElementById("noteCategory").value = "Personal";
            document.getElementById("noteContent").value = "";
            document.getElementById("noteModal").classList.add("active");
        }

        // Open edit modal
        function openEditModal(id) {
            let note = notes.find(n => n.id === id);
            if (!note) return;

            editingId = id;
            document.getElementById("modalTitle").textContent = "Edit Note";
            document.getElementById("noteTitle").value = note.title;
            document.getElementById("noteCategory").value = note.category;
            document.getElementById("noteContent").value = note.content;
            document.getElementById("noteModal").classList.add("active");
        }

        // Close modal
        function closeModal() {
            document.getElementById("noteModal").classList.remove("active");
            editingId = null;
        }

        // Save note
        function saveNote(event) {
            event.preventDefault();

            let title = document.getElementById("noteTitle").value.trim();
            let category = document.getElementById("noteCategory").value;
            let content = document.getElementById("noteContent").value.trim();

            if (!title || !content) {
                alert("Judul dan konten tidak boleh kosong!");
                return;
            }

            if (editingId) {
                // Edit existing note
                let note = notes.find(n => n.id === editingId);
                if (note) {
                    note.title = title;
                    note.category = category;
                    note.content = content;
                    note.updatedAt = new Date().toISOString();
                }
            } else {
                // Add new note
                let newNote = {
                    id: Date.now(),
                    title: title,
                    category: category,
                    content: content,
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                };
                notes.push(newNote);
            }

            saveNotesToStorage();
            render();
            closeModal();
        }

        // Delete note
        function deleteNote(id) {
            if (confirm("Yakin ingin menghapus note ini?")) {
                notes = notes.filter(n => n.id !== id);
                saveNotesToStorage();
                render();
            }
        }

        // Filter notes
        function filterNotes() {
            let searchTerm = document.getElementById("searchBox").value.toLowerCase();
            let filtered = notes.filter(note => 
                note.title.toLowerCase().includes(searchTerm) ||
                note.content.toLowerCase().includes(searchTerm) ||
                note.category.toLowerCase().includes(searchTerm)
            );
            renderNotes(filtered);
        }

        // Format date
        function formatDate(dateString) {
            let date = new Date(dateString);
            return date.toLocaleDateString("id-ID", {
                year: "numeric",
                month: "short",
                day: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            });
        }

        // Render notes
        function renderNotes(notesToRender = notes) {
            let grid = document.getElementById("notesGrid");
            let emptyState = document.getElementById("emptyState");

            grid.innerHTML = "";

            if (notesToRender.length === 0) {
                emptyState.style.display = "block";
                return;
            }

            emptyState.style.display = "none";

            notesToRender.forEach(note => {
                let card = document.createElement("div");
                card.className = "note-card";
                card.innerHTML = `
                    <div class="note-title">${escapeHtml(note.title)}</div>
                    <div class="note-category">${note.category}</div>
                    <div class="note-content">${escapeHtml(note.content)}</div>
                    <div class="note-date">Diubah: ${formatDate(note.updatedAt)}</div>
                    <div class="note-actions">
                        <button class="btn-small btn-edit" onclick="openEditModal(${note.id})">Edit</button>
                        <button class="btn-small btn-delete" onclick="deleteNote(${note.id})">Hapus</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Render
        function render() {
            renderNotes();
        }

        // Escape HTML
        function escapeHtml(text) {
            let div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            let modal = document.getElementById("noteModal");
            if (event.target === modal) {
                closeModal();
            }
        };

        // Initial load
        loadNotes();
    </script>
</body>
</html>
