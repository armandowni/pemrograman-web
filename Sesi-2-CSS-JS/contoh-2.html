<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS dan JavaScript</title>
    <link rel="stylesheet" href="web.css" />
  </head>
  <body>
    <div class="container">
      <h1>CSS dan JavaScript Demo</h1>

      <div class="info">
        <strong>Info:</strong> Klik tombol di bawah untuk melihat interaktivitas
        JavaScript
      </div>

      <div class="input-group">
        <label for="nama">Masukkan Nama:</label>
        <input type="text" id="nama" placeholder="Nama Anda" />
      </div>

      <button class="button" onclick="greet()">Sapa Saya</button>
      <button class="button" onclick="changeBackground()">
        Ubah Warna Background
      </button>

      <div class="counter">Counter: <span id="count">0</span></div>

      <button class="button" onclick="increment()">Tambah</button>
      <button class="button" onclick="decrement()">Kurang</button>
      <button class="button" onclick="reset()">Reset</button>
    </div>

    <script>
      let counter = 0;

      function greet() {
        let nama = document.getElementById("nama").value;
        if (nama === "") {
          alert("Masukkan nama terlebih dahulu!");
          console.log("Nama tidak boleh kosong");
        } else {
          alert("Halo, " + nama + "! Selamat datang!");
          console.log(`Halo, ${nama}! Selamat datang!`);
        }
      }

      function changeBackground() {
        let colors = ["#FFE5E5", "#E5F3FF", "#E5FFE5", "#FFF9E5"];
        let randomColor = colors[Math.floor(Math.random() * colors.length)];
        document.body.style.backgroundColor = randomColor;
      }

      function increment() {
        counter++;
        updateCounter();
      }

      function decrement() {
        counter--;
        updateCounter();
      }

      function reset() {
        counter = 0;
        updateCounter();
      }

      function updateCounter() {
        document.getElementById("count").textContent = counter;
      }
    </script>
  </body>
</html>
